# Pins stay exact; Dependabot keeps them current by opening a reviewable PR for each update
version: 2
updates:
  # requirements*.in -> requirements*.txt (pip-compile locks, hashes regenerated by Dependabot)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  # Base image digest in the Dockerfile, so Debian security fixes arrive as a PR
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
